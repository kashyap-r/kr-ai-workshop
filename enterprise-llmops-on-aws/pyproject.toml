[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-llmops-on-aws"
version = "0.1.0"
description = "Enterprise LLMOps platform on AWS"
requires-python = ">=3.10"

dependencies = [
    "boto3",
    "sagemaker",
    "mlflow",
    "fastapi"
]

[tool.setuptools.packages.find]
where = ["src"]