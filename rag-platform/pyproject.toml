[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform"
version = "0.1.0"
description = "Production-oriented, bare-metal RAG platform reference implementation"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kashyap Rajpurohit" }
]
dependencies = [
    "chromadb>=1.5.9",
    "pypdf>=6.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[project.scripts]
rag-platform = "rag_platform.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------
# Pytest
# ---------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
pythonpath = ["src"]

# ---------------------------------------------------------
# Ruff
# ---------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "B",      # bugbear
    "UP",     # pyupgrade
    "SIM",    # simplification
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------
# Mypy
# ---------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "sentence-transformers>=6.0.1",
]
